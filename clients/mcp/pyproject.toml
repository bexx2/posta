[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "posta-mcp"
version = "0.1.0"
description = "MCP server for posta: give an AI agent its own real mailbox (create, send, read, wait for mail)."
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.10"
dependencies = ["mcp>=2,<3", "posta-sdk>=0.1"]

[project.scripts]
posta-mcp = "posta_mcp.server:main"

[project.urls]
Homepage = "https://posta.preved.co"
Source = "https://github.com/bexx2/posta"

[tool.setuptools]
packages = ["posta_mcp"]
